name: Update meta on push

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "!api/meta/update.json"

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build update-epoch metadata
        run: python3 scripts/build_update_meta.py

      - name: Commit updated meta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/meta/update.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh api/meta/update.json"
            git push
          fi
