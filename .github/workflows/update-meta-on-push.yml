name: Update meta on push

# api/reading, api/chapter-slok and api/topics are now hand-translated
# (multilingual fields) rather than generated from db/gita.db --
# scripts/build_reading_api.py, build_chapter_api.py and build_topics_api.py
# still only produce the old flat-string shape and would overwrite those
# translations, so this workflow no longer regenerates them. It only keeps
# api/meta/update.json's per-file epochs in sync with whatever is committed.

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "!api/meta/update.json"

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build update-epoch metadata
        run: python3 scripts/build_update_meta.py

      - name: Commit updated meta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/meta/update.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh api/meta/update.json"
            git push
          fi
