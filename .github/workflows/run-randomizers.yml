name: Run randomizers

on:
  schedule:
    # 00:00 IST = 18:30 UTC (previous day)
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  randomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build gita.db from source JSON
        run: python3 db/build_db.py

      # api/reading, api/chapter-slok and api/topics are hand-translated
      # (multilingual name/translation/transliteration/life_application
      # fields) and are no longer regenerated here -- scripts/build_reading_api.py,
      # build_chapter_api.py and build_topics_api.py still only produce the
      # old flat-string shape and would overwrite those translations.

      - name: Run every randomizer script
        run: |
          for f in scripts/randomizers/*.py; do
            echo "running $f"
            python3 "$f"
          done

      - name: Build update-epoch metadata
        run: python3 scripts/build_update_meta.py

      - name: Commit updated static apis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh randomized static apis"
            git push
          fi
