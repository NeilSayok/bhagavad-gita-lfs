name: Regenerate static apis on push

on:
  push:
    branches: [main]
    paths:
      - "api/chapter/**"
      - "api/slok/**"
      - "db/schema.sql"
      - "db/build_db.py"
      - "api/build_reading_api.py"
      - "api/build_chapter_api.py"
      - "api/build_topics_api.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build gita.db from source JSON
        run: python3 db/build_db.py

      - name: Build static apis
        run: |
          python3 api/build_reading_api.py
          python3 api/build_chapter_api.py
          python3 api/build_topics_api.py

      - name: Build update-epoch metadata
        run: python3 scripts/build_update_meta.py

      - name: Commit regenerated static apis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/reading api/chapter-slok api/topics api/meta
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: regenerate static apis from source"
            git push
          fi
